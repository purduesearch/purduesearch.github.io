name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs so a
# mid-flight deploy isn't left in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Prevents ESLint warnings from failing the build on CI
          CI: false
          # Points the ClubPM API client at the Oracle backend (set in repo Settings → Secrets)
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          # Temporary rollout switch for the Constellation phone layout
          # (src/clubpm/layout/compactLayout.js). Unset = on. Set the repo
          # variable to "off" and re-run this workflow to ship the desktop shell
          # at every width. Remove once the mobile redesign is stable.
          REACT_APP_CLUBPM_COMPACT: ${{ vars.REACT_APP_CLUBPM_COMPACT }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
