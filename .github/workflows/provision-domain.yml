name: Provision Backend Domain (manual)

# Adds an nginx server block + Let's Encrypt certificate for a new backend
# hostname (default: api.purduesearch.org) on the Oracle box, ALONGSIDE the
# existing one. Nothing is removed — both hostnames serve simultaneously, which
# is what makes the domain cutover reversible without a DNS wait.
#
# Runs over the SAME SSH channel as deploy-backend.yml (ORACLE_HOST /
# ORACLE_USER / ORACLE_SSH_KEY). Inert until dispatched from the Actions tab.
# It does NOT touch backend/**, so it won't trigger a backend deploy.
#
#   mode = diagnose  -> report only, change nothing (default)
#   mode = apply     -> write server block, run certbot, validate, reload
#
# Prerequisite: the DNS A record for `domain` must already point at this box.
# `apply` refuses to run certbot otherwise — a premature request burns one of
# Let's Encrypt's 5-failures-per-hour attempts for the hostname.
#
# After this succeeds, the remaining cutover steps are:
#   1. update .env on the server (BACKEND_URL, FRONTEND_URL, CORS_EXTRA_ORIGINS,
#      APP_BASE_URL, GOOGLE_OAUTH_REDIRECT_URI) and `pm2 restart clubpm-backend`
#   2. add the new callback URLs in the Slack / GitHub / Google consoles
#   3. set the REACT_APP_API_URL repo secret and re-run "Deploy to GitHub Pages"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose (report only) or apply (write nginx + certbot)"
        type: choice
        options:
          - diagnose
          - apply
        default: diagnose
      domain:
        description: "Backend hostname to provision"
        type: string
        default: api.purduesearch.org
      backend_port:
        description: "Backend port (auto = detect from nginx proxy_pass, fallback 3000)"
        type: string
        default: auto
      certbot_email:
        description: "Contact email for Let's Encrypt expiry notices (blank = --register-unsafely-without-email)"
        type: string
        required: false

concurrency:
  group: provision-domain
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Provision domain over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          MODE: ${{ inputs.mode }}
          DOMAIN_INPUT: ${{ inputs.domain }}
          BACKEND_PORT_INPUT: ${{ inputs.backend_port }}
          CERTBOT_EMAIL: ${{ inputs.certbot_email }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 10m
          envs: MODE,DOMAIN_INPUT,BACKEND_PORT_INPUT,CERTBOT_EMAIL
          script_stop: false
          script: |
            set -uo pipefail
            MODE="${MODE:-diagnose}"
            DOMAIN="${DOMAIN_INPUT:-api.purduesearch.org}"
            PORT_INPUT="${BACKEND_PORT_INPUT:-auto}"

            echo "=================================================================="
            echo " Provision backend domain  —  mode: $MODE  domain: $DOMAIN"
            echo " $(whoami)@$(hostname)  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "=================================================================="

            # ---- resolve backend port (same detection as fix-collab-websocket) ----
            PORT=""
            case "$PORT_INPUT" in
              ""|auto) ;;
              *[!0-9]*) echo "   (ignoring non-numeric backend_port '$PORT_INPUT')" ;;
              *)        PORT="$PORT_INPUT" ;;
            esac
            if [ -z "$PORT" ]; then
              PORT=$(sudo -n nginx -T 2>/dev/null \
                | grep -oE 'proxy_pass +https?://(127\.0\.0\.1|localhost):[0-9]+' \
                | grep -oE '[0-9]+$' | head -n1)
            fi
            [ -z "$PORT" ] && PORT="3000"
            echo "## Backend port: $PORT"

            # ===========================================================
            #  DIAGNOSTICS (always run, in both modes)
            # ===========================================================
            echo
            echo "=========================================="
            echo " DIAGNOSTICS"
            echo "=========================================="

            echo
            echo "## This host's public IP"
            PUBLIC_IP=$(curl -sS --max-time 6 https://api.ipify.org 2>/dev/null || echo "(lookup failed)")
            echo "   $PUBLIC_IP"

            echo
            echo "## DNS for $DOMAIN"
            RESOLVED=$(getent ahostsv4 "$DOMAIN" 2>/dev/null | awk '{print $1}' | sort -u | head -n5)
            if [ -n "$RESOLVED" ]; then
              echo "$RESOLVED" | sed 's/^/   /'
            else
              echo "   (does not resolve)"
            fi

            DNS_OK=0
            if [ -n "$RESOLVED" ] && [ "$PUBLIC_IP" != "(lookup failed)" ]; then
              if echo "$RESOLVED" | grep -qx "$PUBLIC_IP"; then
                DNS_OK=1
                echo "   -> matches this host ✓"
              else
                echo "   -> does NOT match this host's IP ($PUBLIC_IP)"
                echo "      If you just changed DNS, wait for TTL. If you use Cloudflare,"
                echo "      make sure the record is DNS-only (grey cloud), not proxied —"
                echo "      a proxied record hides the origin and breaks both certbot"
                echo "      validation and the /collab/* WebSocket upgrade path."
              fi
            fi

            echo
            echo "## nginx server_name directives currently configured"
            sudo -n nginx -T 2>/dev/null | grep -E '^\s*server_name' | sort -u | sed 's/^/   /' \
              || echo "   (unable to read nginx config)"

            echo
            echo "## Existing certbot certificates"
            if command -v certbot >/dev/null 2>&1; then
              sudo -n certbot certificates 2>/dev/null \
                | grep -E 'Certificate Name|Domains|Expiry Date' | sed 's/^/   /' \
                || echo "   (certbot certificates returned nothing)"
            else
              echo "   ✗ certbot is NOT installed on this host"
            fi

            echo
            echo "## Backend listening on port $PORT"
            ss -tlnp 2>/dev/null | grep ":$PORT " | sed 's/^/   /' \
              || echo "   (nothing listening on $PORT — backend may be down)"

            echo
            echo "## Local HTTP health check"
            echo "   http://127.0.0.1:$PORT/  ->  $(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:$PORT/" 2>&1 || echo '(failed)')"

            if [ "$MODE" != "apply" ]; then
              echo
              echo "------------------------------------------------------------------"
              echo " diagnose mode only — re-run with mode=apply to write the nginx"
              echo " server block for $DOMAIN and request a certificate."
              echo "------------------------------------------------------------------"
              exit 0
            fi

            # ===========================================================
            #  APPLY
            # ===========================================================
            echo
            echo "=================================================================="
            echo " APPLY — provisioning $DOMAIN"
            echo "=================================================================="

            if ! sudo -n true 2>/dev/null; then
              echo "!! Passwordless sudo unavailable — cannot edit nginx here."
              exit 1
            fi
            if ! command -v nginx >/dev/null 2>&1; then
              echo "!! nginx not found. This workflow only supports nginx."
              exit 1
            fi
            if ! command -v certbot >/dev/null 2>&1; then
              echo "!! certbot not installed. Install it first, e.g.:"
              echo "     sudo apt-get update && sudo apt-get install -y certbot python3-certbot-nginx"
              exit 1
            fi
            if [ "$DNS_OK" != "1" ]; then
              echo "!! $DOMAIN does not resolve to this host — refusing to run certbot."
              echo "   Let's Encrypt allows only 5 validation failures per hostname per"
              echo "   hour; burning them on a known-bad DNS state costs you the cutover"
              echo "   window. Fix DNS, confirm with mode=diagnose, then re-run."
              exit 1
            fi

            TS=$(date -u '+%Y%m%d%H%M%S')

            # ---- 1) $connection_upgrade map (http context), if not already present ----
            if sudo -n nginx -T 2>/dev/null | grep -qE 'map +\$http_upgrade'; then
              echo "-> \$connection_upgrade map already defined; reusing it."
            else
              echo "-> Adding /etc/nginx/conf.d/clubpm-collab-ws.conf (upgrade map)."
              printf '%s\n' \
                '# Maps the Upgrade request header so proxied WebSocket handshakes' \
                '# negotiate. Shared by every ClubPM server block.' \
                'map $http_upgrade $connection_upgrade {' \
                '    default upgrade;' \
                "    ''      close;" \
                '}' \
                | sudo -n tee /etc/nginx/conf.d/clubpm-collab-ws.conf >/dev/null
            fi

            # ---- 2) plain-HTTP server block for the new domain ----
            # certbot --nginx finds this by server_name, then rewrites it in place
            # to add the 443 listener, cert paths, and the HTTP->HTTPS redirect.
            SITE_FILE="/etc/nginx/sites-available/clubpm-$DOMAIN"
            if [ ! -d /etc/nginx/sites-available ]; then
              SITE_FILE="/etc/nginx/conf.d/clubpm-$DOMAIN.conf"
            fi

            if sudo -n nginx -T 2>/dev/null | grep -qE "server_name .*\b$DOMAIN\b"; then
              echo "-> A server block for $DOMAIN already exists — leaving it as-is."
            else
              echo "-> Writing $SITE_FILE"
              sudo -n tee "$SITE_FILE" >/dev/null << NGINXEOF
            # ClubPM / Constellation backend — $DOMAIN
            # Created by .github/workflows/provision-domain.yml on $TS
            #
            # Intentionally coexists with the older DuckDNS server block: both
            # hostnames serve the same backend during the domain cutover so a
            # rollback needs no server change. Remove the old block only after
            # the new hostname has soaked.
            server {
                listen 80;
                listen [::]:80;
                server_name $DOMAIN;

                # Vault CAD uploads are large; matches the limit server-maint.yml sets.
                client_max_body_size 512M;

                # Realtime collaboration (Hocuspocus): /collab/blog, /collab/presskit,
                # /collab/course. Needs the upgrade headers and a long read timeout —
                # an idle-timeout disconnect here is what fix-collab-websocket.yml
                # exists to diagnose.
                location /collab/ {
                    proxy_pass http://127.0.0.1:$PORT;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection \$connection_upgrade;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 3600s;
                    proxy_send_timeout 3600s;
                }

                location / {
                    proxy_pass http://127.0.0.1:$PORT;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;

                    # Server-Sent Events (/api/sse) must not be buffered.
                    proxy_buffering off;
                    proxy_read_timeout 3600s;
                }
            }
            NGINXEOF

              # Enable it if this box uses the sites-available/sites-enabled layout.
              if [ -d /etc/nginx/sites-enabled ] && [ "${SITE_FILE#/etc/nginx/sites-available/}" != "$SITE_FILE" ]; then
                ENABLED="/etc/nginx/sites-enabled/$(basename "$SITE_FILE")"
                if [ ! -e "$ENABLED" ]; then
                  echo "-> Symlinking $SITE_FILE -> $ENABLED"
                  sudo -n ln -s "$SITE_FILE" "$ENABLED"
                fi
              fi
            fi

            # ---- 3) validate before reloading ----
            echo
            echo "-> nginx -t"
            if ! sudo -n nginx -t; then
              echo "!! nginx -t FAILED — removing the new server block and stopping."
              sudo -n rm -f "$SITE_FILE" "/etc/nginx/sites-enabled/$(basename "$SITE_FILE")"
              sudo -n nginx -t && echo "   Config restored to its previous working state."
              exit 1
            fi
            echo "-> config OK — reloading nginx"
            sudo -n systemctl reload nginx || sudo -n nginx -s reload

            # ---- 4) certbot ----
            echo
            echo "-> Requesting certificate for $DOMAIN"
            if [ -n "${CERTBOT_EMAIL:-}" ]; then
              EMAIL_ARGS="--email $CERTBOT_EMAIL"
            else
              EMAIL_ARGS="--register-unsafely-without-email"
            fi

            if sudo -n certbot certificates 2>/dev/null | grep -qE "^\s+Domains:.*\b$DOMAIN\b"; then
              echo "   Certificate for $DOMAIN already exists — installing into nginx only."
              sudo -n certbot install --nginx -d "$DOMAIN" --redirect --non-interactive
              CERT_RC=$?
            else
              sudo -n certbot --nginx -d "$DOMAIN" \
                --agree-tos $EMAIL_ARGS --non-interactive --redirect
              CERT_RC=$?
            fi

            if [ "$CERT_RC" -ne 0 ]; then
              echo "!! certbot failed (exit $CERT_RC)."
              echo "   The plain-HTTP block is still in place; nothing else was changed."
              echo "   Common causes: DNS not fully propagated, port 80 blocked by the"
              echo "   Oracle Cloud security list / iptables, or a proxied Cloudflare record."
              exit 1
            fi

            # ---- 5) re-validate and reload ----
            echo
            echo "-> nginx -t (post-certbot)"
            if sudo -n nginx -t; then
              sudo -n systemctl reload nginx || sudo -n nginx -s reload
            else
              echo "!! nginx -t failed after certbot — inspect manually. Not reloading."
              exit 1
            fi

            # ===========================================================
            #  VERIFY
            # ===========================================================
            echo
            echo "=========================================="
            echo " VERIFY"
            echo "=========================================="

            echo
            echo "## HTTPS reachability"
            echo "   https://$DOMAIN/  ->  $(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$DOMAIN/" 2>&1 || echo '(unreachable)')"

            echo
            echo "## HTTP -> HTTPS redirect  [expect 301]"
            echo "   http://$DOMAIN/  ->  $(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "http://$DOMAIN/" 2>&1 || echo '(unreachable)')"

            echo
            echo "## WebSocket upgrade through the new hostname  [want: 101 CONNECTED]"
            ws_node_probe() {
              cd /opt/clubpm/backend 2>/dev/null || true
              timeout 10 node -e "
                const ws = require('ws');
                const socket = new ws.WebSocket('$1');
                const t = setTimeout(() => { console.log('TIMEOUT (6s)'); process.exit(2); }, 6000);
                socket.on('open', () => { clearTimeout(t); console.log('101 CONNECTED'); socket.close(); process.exit(0); });
                socket.on('error', (e) => { clearTimeout(t); console.log('ERROR: ' + e.message); process.exit(1); });
                socket.on('unexpected-response', (req, res) => { clearTimeout(t); console.log('HTTP ' + res.statusCode); process.exit(1); });
              " 2>&1 || echo "(node probe crashed)"
            }
            ok=1
            for p in /collab/blog /collab/presskit /collab/course; do
              line=$(ws_node_probe "wss://$DOMAIN$p")
              echo "   $p  ->  $line"
              echo "$line" | grep -q "101 CONNECTED" || ok=0
            done

            echo
            if [ "$ok" = "1" ]; then
              echo "✅ $DOMAIN is serving HTTPS and upgrading WebSockets."
            else
              echo "⚠️  HTTPS is up but at least one /collab/ upgrade did not return 101."
              echo "   Run the 'Fix Collab WebSocket' workflow with domain=$DOMAIN to dig in."
            fi
            echo
            echo "Next: update .env on this box, then the OAuth consoles, then the"
            echo "REACT_APP_API_URL repo secret. The old hostname still works until you"
            echo "remove its server block — that is your rollback."
            echo "== Done =="
