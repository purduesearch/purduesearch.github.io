display_information:
  name: SEARCH PM
  description: Slack-first project management for SEARCH engineering club
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: Club PM
    always_online: true
  slash_commands:
    - command: /pm
      description: Manage projects and tasks
      usage_hint: "task | standup | report | help"
      should_escape: false

oauth_config:
  redirect_urls:
    - http://localhost:3001/auth/slack/callback
    - https://YOUR_ORACLE_DOMAIN/auth/slack/callback
  scopes:
    bot:
      - chat:write
      - commands
      - channels:read
      - channels:history
      - channels:join
      - users:read
      - users:read.email
      - usergroups:read
      - im:write
      - groups:read
      - groups:history
      - reactions:read
      - files:read
      - emoji:read
    user:
      - users:read
      - users:read.email
      - channels:read
      - groups:read
      - mpim:read
      - im:read
      - channels:write.invites
      - groups:write.invites
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
      - reactions:write
      - files:read
      - files:write
      - im:write
      - mpim:write
      - channels:write
      - groups:write

settings:
  socket_mode_enabled: true
  token_rotation_enabled: false
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - channel_created
      - member_joined_channel
      - member_left_channel
      - reaction_added
      - reaction_removed
      - file_shared
    # Events on behalf of every member who signed in. Slack delivers each event
    # ONCE per app even when several authorizations can see it.
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
      - member_joined_channel
      - member_left_channel
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
