<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b83225" />
    <meta name="description" content="Purdue SEARCH is a student-led space research organization at Purdue University. We run analog astronaut training, bioastronautics research, and space habitat design programs." />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Purdue SEARCH | Space Analog Astronaut Research Chapter</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://purduesearch.github.io/" />
    <meta property="og:title" content="Purdue SEARCH | Space Analog Astronaut Research Chapter" />
    <meta property="og:description" content="Student-led analog astronaut training, bioastronautics research, and space habitat design at Purdue University." />
    <meta property="og:image" content="https://purduesearch.github.io/icons/purdue_search_logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@purduesearch" />
    <meta name="twitter:title" content="Purdue SEARCH | Space Analog Astronaut Research Chapter" />
    <meta name="twitter:description" content="Student-led analog astronaut training, bioastronautics research, and space habitat design at Purdue University." />
    <meta name="twitter:image" content="https://purduesearch.github.io/icons/purdue_search_logo.png" />

    <!-- Canonical + hreflang are emitted per-route by src/components/SEOHead.jsx
         (React 19 hoists them into <head>). A static copy here pointed every
         route at the homepage, producing conflicting canonicals on subpages. -->

    <!-- JSON-LD Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Purdue SEARCH",
      "alternateName": "Space and Earth Analogs Research Chapter of Purdue",
      "url": "https://purduesearch.github.io/",
      "logo": "https://purduesearch.github.io/icons/purdue_search_logo.png",
      "description": "Student-led space analog research organization at Purdue University focused on analog astronaut training, bioastronautics, space habitat design, and outreach.",
      "foundingDate": "2022",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "610 Purdue Mall",
        "addressLocality": "West Lafayette",
        "addressRegion": "IN",
        "postalCode": "47907",
        "addressCountry": "US"
      },
      "sameAs": [
        "https://www.instagram.com/purdue_search/",
        "https://twitter.com/purduesearch",
        "https://www.linkedin.com/company/purdue-search/",
        "https://www.youtube.com/channel/UCLDbIwWQl9hdfFn27U9r-yg",
        "https://boilerlink.purdue.edu/organization/search"
      ],
      "parentOrganization": {
        "@type": "CollegeOrUniversity",
        "name": "Purdue University",
        "url": "https://www.purdue.edu"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "general inquiry",
        "url": "https://purduesearch.github.io/contact"
      }
    }
    </script>

    <!-- Preconnect to external origins (reduces connection latency) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://code.jquery.com" />

    <!-- Google Fonts (pruned: only families that actually render win the cascade — see task-9 report for
         trace). Montserrat + Work Sans are kept for the blog "montserrat-worksans" theme font pair;
         Syne/DM Sans/JetBrains Mono load from the @import at the top of search-theme.css. -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lato:wght@300;400&family=Montserrat:wght@400;500;700;900&family=Work+Sans:wght@300;400;700&display=swap" rel="stylesheet" />

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />

    <!-- Font Awesome 6 (FA5 names remain valid; renamed icons are aliased) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- LinearIcons (used in Navbar and Contact) -->
    <link rel="stylesheet" href="https://cdn.linearicons.com/free/1.0.0/icon-font.min.css" />

    <!-- Base template styles (must load before search-theme overrides) -->
    <link rel="stylesheet" href="%PUBLIC_URL%/style.min.css" />

    <!-- SEARCH Theme Overrides — must load last.
         ClubPM-only rules live in clubpm-theme.css and are fetched on demand by
         src/clubpm/loadClubPmTheme.js, so public pages never download them. -->
    <link rel="stylesheet" href="%PUBLIC_URL%/search-theme.css?v=4" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- jQuery (required: Navbar.jsx mobile toggle uses window.$ + Bootstrap's collapse plugin) -->
    <script defer src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap 4 Bundle JS (includes Popper; required: data-toggle="collapse" + show/hide.bs.collapse events in Navbar.jsx) -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
