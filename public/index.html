<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b83225" />
    <meta name="description" content="SEARCH is a student-led space research organization at Purdue University. We run astronaut training, bioastronautics research, and space habitat programs." />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Purdue SEARCH | Space Analog Astronaut Research Chapter</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://purduesearch.org/" />
    <meta property="og:title" content="Purdue SEARCH | Space Analog Astronaut Research Chapter" />
    <meta property="og:description" content="Student-led analog astronaut training, bioastronautics research, and space habitat design at Purdue University." />
    <meta property="og:image" content="https://purduesearch.org/icons/purdue_search_logo.png" />
    <meta property="og:image:alt" content="Purdue SEARCH logo" />
    <meta property="og:image:width" content="200" />
    <meta property="og:image:height" content="200" />

    <!-- Twitter Card. "summary", not "summary_large_image": og:image is the
         200x200 square logo and X drops the image entirely on a large card
         below 300x157. SEOHead.jsx upgrades to the large card per-route when a
         page supplies a wide image of its own. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@purduesearch" />
    <meta name="twitter:title" content="Purdue SEARCH | Space Analog Astronaut Research Chapter" />
    <meta name="twitter:description" content="Student-led analog astronaut training, bioastronautics research, and space habitat design at Purdue University." />
    <meta name="twitter:image" content="https://purduesearch.org/icons/purdue_search_logo.png" />
    <meta name="twitter:image:alt" content="Purdue SEARCH logo" />

    <!-- Canonical + hreflang are emitted per-route by src/components/SEOHead.jsx
         (React 19 hoists them into <head>). A static copy here pointed every
         route at the homepage, producing conflicting canonicals on subpages. -->

    <!-- JSON-LD Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Purdue SEARCH",
      "alternateName": "Space and Earth Analogs Research Chapter of Purdue",
      "url": "https://purduesearch.org/",
      "logo": "https://purduesearch.org/icons/purdue_search_logo.png",
      "description": "Student-led space analog research organization at Purdue University focused on analog astronaut training, bioastronautics, space habitat design, and outreach.",
      "foundingDate": "2022",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "610 Purdue Mall",
        "addressLocality": "West Lafayette",
        "addressRegion": "IN",
        "postalCode": "47907",
        "addressCountry": "US"
      },
      "sameAs": [
        "https://www.instagram.com/purdue_search/",
        "https://twitter.com/purduesearch",
        "https://www.linkedin.com/company/purdue-search/",
        "https://www.youtube.com/channel/UCLDbIwWQl9hdfFn27U9r-yg",
        "https://boilerlink.purdue.edu/organization/search"
      ],
      "parentOrganization": {
        "@type": "CollegeOrUniversity",
        "name": "Purdue University",
        "url": "https://www.purdue.edu"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "general inquiry",
        "url": "https://purduesearch.org/contact"
      }
    }
    </script>

    <!-- Preconnect to external origins (reduces connection latency) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- jsDelivr is still needed for the Bootstrap 4 CSS link below. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Google Fonts (pruned: only families that actually render win the cascade — see task-9 report for
         trace). Montserrat + Work Sans are kept for the blog "montserrat-worksans" theme font pair.
         Syne/DM Sans/JetBrains Mono are merged in here too: they used to come from an @import at the
         top of search-theme.css, which serialised HTML -> search-theme.css -> fonts css -> woff2.
         One <link> = one request, discovered by the preload scanner in the initial HTML. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&family=Lato:wght@300;400&family=Montserrat:wght@400;500;700;900&family=Oswald:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Work+Sans:wght@300;400;700&display=swap" rel="stylesheet" />

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />

    <!-- Font Awesome 6 — self-hosted subset (FA5 names remain valid; renamed icons are aliased).
         Generated by scripts/build-fa-subset.mjs from @fortawesome/fontawesome-free, and
         regenerated automatically by the `prebuild` npm script. Ships only the ~270 glyphs the
         site actually uses instead of all ~1,900, so the webfonts cost ~23 kB rather than ~293 kB.
         Runtime-built class names (`fas fa-${x}`) must be listed in scripts/fa-icons-extra.txt. -->
    <link rel="preload" as="font" type="font/woff2" href="%PUBLIC_URL%/webfonts/fa-solid-900.woff2" crossorigin />
    <link rel="stylesheet" href="%PUBLIC_URL%/fa-subset.css" />

    <!-- Base template styles (must load before search-theme overrides) -->
    <link rel="stylesheet" href="%PUBLIC_URL%/style.min.css" />

    <!-- SEARCH Theme Overrides — must load last.
         ClubPM-only rules live in clubpm-theme.css and are fetched on demand by
         src/clubpm/loadClubPmTheme.js, so public pages never download them. -->
    <link rel="stylesheet" href="%PUBLIC_URL%/search-theme.css?v=6" />

    <!-- ClubPM dark boot.
         /clubpm/* is a dark dashboard, but the body is cream until React
         mounts and clubpm-theme.css is fetched. Stamping the route on <html>
         from a blocking script means the first paint is already dark, so a
         hard load or the ?lt= login redirect never flashes cream.
         Styles: "ClubPM boot screen" section of search-theme.css.
         Kept in sync on client-side navigation by AnimatedRoutes (src/App.js). -->
    <script>
      (function () {
        var p = window.location.pathname;
        var clubpm = p === '/clubpm' || p.lastIndexOf('/clubpm/', 0) === 0;
        if (clubpm) {
          document.documentElement.classList.add('clubpm-route');
        }
        // /schedule/:token and /rsvp/:eventId are public but paint the dark
        // ClubPM look, so they need the dark body without the theme preload
        // below. Keep in sync with AnimatedRoutes in src/App.js.
        if (clubpm || p.lastIndexOf('/schedule/', 0) === 0 || p.lastIndexOf('/rsvp/', 0) === 0) {
          document.documentElement.classList.add('pm-dark-route');
        }
      })();
    </script>

    <!-- Warm the ClubPM stylesheet in parallel with the JS bundle so the boot
         screen is not also waiting on a cold CSS fetch. Must match the href in
         src/clubpm/loadClubPmTheme.js or the preload is wasted. -->
    <script>
      (function () {
        if (!document.documentElement.classList.contains('clubpm-route')) return;
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'style';
        l.href = '/clubpm-theme.css?v=1';
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- No jQuery, no Bootstrap JS bundle: the mobile navbar toggle was their only
         consumer and Navbar.jsx now drives `.show` from React state (animation in the
         "Mobile navbar collapse animation" section of search-theme.css). Bootstrap's
         *CSS* is still linked above — the grid is used site-wide. -->
  </body>
</html>
