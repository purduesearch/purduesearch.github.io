    <!-- Orbit Loader splash screen -->
    <style>
      #orbit-loader {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.6s ease;
      }
      #orbit-loader.fade-out { opacity: 0; pointer-events: none; }
      #orbit-loader * { box-sizing: border-box; margin: 0; padding: 0; }

      .ol-glow {
        position: fixed;
        top: 50%; left: 50%;
        width: 620px; height: 620px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%,
          rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.05) 28%,
          rgba(255,255,255,0.018) 50%, rgba(255,255,255,0) 72%);
        pointer-events: none;
        animation: ol-glow-breathe 6s ease-in-out infinite;
      }
      .ol-starfield { position: fixed; inset: 0; pointer-events: none; }
      .ol-star { position: absolute; border-radius: 50%; background: #fff; }

      .ol-wrap { position: relative; width: 200px; height: 200px; }

      .ol-whirl {
        position: absolute;
        inset: -6%;
        border-radius: 50%;
        background: conic-gradient(from 0deg,
          rgba(255,255,255,0) 0deg, rgba(255,255,255,0) 200deg,
          rgba(255,255,255,0.10) 300deg, rgba(255,255,255,0.35) 350deg,
          rgba(255,255,255,0) 360deg);
        -webkit-mask: radial-gradient(closest-side, transparent 64%, #000 70%, #000 98%, transparent 100%);
                mask: radial-gradient(closest-side, transparent 64%, #000 70%, #000 98%, transparent 100%);
        animation: ol-spin 2.6s linear infinite;
      }
      .ol-whirl.two {
        inset: 4%;
        background: conic-gradient(from 0deg,
          rgba(255,255,255,0) 0deg, rgba(255,255,255,0) 230deg,
          rgba(255,255,255,0.06) 320deg, rgba(255,255,255,0.22) 358deg,
          rgba(255,255,255,0) 360deg);
        -webkit-mask: radial-gradient(closest-side, transparent 52%, #000 60%, #000 97%, transparent 100%);
                mask: radial-gradient(closest-side, transparent 52%, #000 60%, #000 97%, transparent 100%);
        animation: ol-spin 2.0s linear infinite;
      }

      .ol-sun {
        position: absolute;
        top: 50%; left: 50%;
        width: 24px; height: 24px;
        margin: -12px 0 0 -12px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #fff 0%, #fff 55%, rgba(255,255,255,0.85) 100%);
        box-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 16px rgba(255,255,255,0.55), 0 0 30px rgba(255,255,255,0.3);
        animation: ol-sun-pulse 2.8s ease-in-out infinite;
      }

      .ol-orbit {
        position: absolute;
        top: 50%; left: 50%;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 50%;
        animation-name: ol-spin-orbit;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .ol-orbit::before {
        content: "";
        position: absolute;
        top: -1px; left: 50%;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 6px rgba(255,255,255,0.85);
        transform: translate(-50%, -50%);
      }
      .ol-o1 { width: 50px;  height: 50px;  animation-duration: 1.5s; }
      .ol-o1::before { width: 6px; height: 6px; }
      .ol-o2 { width: 80px;  height: 80px;  animation-duration: 2.4s; }
      .ol-o2::before { width: 9px; height: 9px; }
      .ol-o3 { width: 112px; height: 112px; animation-duration: 3.4s; }
      .ol-o3::before { width: 5px; height: 5px; }
      .ol-o4 { width: 158px; height: 158px; animation-duration: 5.0s; }
      .ol-o4::before { width: 8px; height: 8px; }
      .ol-o5 { width: 186px; height: 186px; animation-duration: 7.0s; }
      .ol-o5::before { width: 4px; height: 4px; }

      .ol-belt {
        position: absolute;
        top: 50%; left: 50%;
        width: 100%; height: 100%;
        animation-name: ol-spin-orbit;
        animation-duration: 14s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .ol-asteroid {
        position: absolute;
        top: 50%; left: 50%;
        border-radius: 50%;
        background: rgba(255,255,255,0.75);
      }

      @keyframes ol-spin { to { transform: rotate(360deg); } }
      @keyframes ol-spin-orbit {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to   { transform: translate(-50%, -50%) rotate(360deg); }
      }
      @keyframes ol-sun-pulse {
        0%, 100% { box-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 16px rgba(255,255,255,0.55), 0 0 30px rgba(255,255,255,0.3); }
        50%       { box-shadow: 0 0 9px rgba(255,255,255,1),   0 0 22px rgba(255,255,255,0.7),  0 0 40px rgba(255,255,255,0.4); }
      }
      @keyframes ol-glow-breathe {
        0%, 100% { opacity: 0.8; }
        50%      { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ol-whirl, .ol-orbit, .ol-sun, .ol-belt, .ol-glow { animation-duration: 8s; }
      }
    </style>

    <!-- Orbit Loader splash screen (dismissed by React in index.js) -->

      <div class="ol-starfield" aria-hidden="true"></div>
      <div class="ol-wrap">
        <div class="ol-whirl"></div>
        <div class="ol-whirl two"></div>
        <div class="ol-orbit ol-o1"></div>
        <div class="ol-orbit ol-o2"></div>
        <div class="ol-orbit ol-o3"></div>
        <div class="ol-belt"></div>
        <div class="ol-orbit ol-o4"></div>
        <div class="ol-orbit ol-o5"></div>
        <div class="ol-sun"></div>
      </div>
    </div>
    <script>
      (function () {
        var field = document.querySelector('.ol-starfield');
        var frag = document.createDocumentFragment();
        for (var i = 0; i < 90; i++) {
          var s = document.createElement('div');
          s.className = 'ol-star';
          var size = Math.random() < 0.85 ? (Math.random() * 1.1 + 0.5) : (Math.random() * 1.4 + 1.6);
          s.style.width = size + 'px';
          s.style.height = size + 'px';
          s.style.left = (Math.random() * 100).toFixed(3) + '%';
          s.style.top = (Math.random() * 100).toFixed(3) + '%';
          s.style.opacity = (Math.random() * 0.55 + 0.12).toFixed(2);
          if (size > 1.6) s.style.boxShadow = '0 0 4px rgba(255,255,255,0.5)';
          frag.appendChild(s);
        }
        field.appendChild(frag);

        var belt = document.querySelector('.ol-belt');
        var frag2 = document.createDocumentFragment();
        for (var j = 0; j < 54; j++) {
          var a = document.createElement('div');
          a.className = 'ol-asteroid';
          var ang = (j / 54) * Math.PI * 2 + (Math.random() - 0.5) * 0.18;
          var r = 67 + (Math.random() - 0.5) * 14;
          a.style.width = a.style.height = (Math.random() * 1.4 + 0.7).toFixed(2) + 'px';
          a.style.opacity = (Math.random() * 0.5 + 0.3).toFixed(2);
          a.style.transform = 'translate(-50%,-50%) translate(' +
            (Math.cos(ang) * r).toFixed(2) + 'px,' +
            (Math.sin(ang) * r).toFixed(2) + 'px)';
          frag2.appendChild(a);
        }
        belt.appendChild(frag2);
      })();
    </script>
