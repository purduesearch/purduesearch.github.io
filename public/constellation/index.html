<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Constellation — moved to /clubpm/login</title>

  <!-- The Constellation application home page was merged into the sign-in page
       at /clubpm/login. GitHub Pages serves static files only and cannot issue a
       301, so this stub carries the redirect three ways: canonical + meta
       refresh for crawlers, location.replace for browsers (replace, not assign,
       so Back doesn't bounce), and a visible link if neither runs. -->
  <link rel="canonical" href="https://purduesearch.org/clubpm/login" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=/clubpm/login" />

  <link rel="icon" href="/favicon.ico" />
  <script>window.location.replace('/clubpm/login');</script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0f14;
      color: #8892a4;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    a { color: #00e5cc; }
  </style>
</head>
<body>
  <p>
    The Constellation application home page has moved to
    <a href="/clubpm/login">purduesearch.org/clubpm/login</a>.
  </p>
</body>
</html>
